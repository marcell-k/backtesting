[build-system]
requires = ["maturin>=1.14"]
build-backend = "maturin"

[project]
name = "backtesting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "bokeh>=3.9.1",
  "numpy>=2.4.6,<2.5",
  "pandas>=3.0.3",
  "sambo>=1.25.2",
  "setuptools>=83.0.0",
  "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "joblib>=1.5.3",
  "maturin>=1.14.1",
  "py-spy>=0.4.2",
  "pytest>=9.1.1",
  "ruff>=0.16.4",
  "sambo>=1.25.2",
  "scikit-learn>=1.9.0",
]

[tool.uv]
package = true
environments = ["sys_platform == 'darwin'"]


[tool.ruff]
line-length = 120
target-version = "py314"

[tool.maturin]
python-source = "src"
module-name = "backtesting._native"
include = [{ path = "src/backtesting/*.js", format = "sdist" }]

[tool.ruff.lint]
select = [
  "ANN",
  "B",
  "D",
  "E",
  "F",
  "I",
  "RUF",
  "S",
  "SIM",
  "UP",
  "C4",
  "FA",
  "ICN",
  "ISC",
  "NPY",
  "PTH",
  "TC",
  "TID",
  "W",
]
ignore = [
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN202",
  "ANN204",
  "ANN401",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D212",
  "D400",
  "D401",
  "D415",
  "D205",
  "S101",
]


# --- basedpyright config ---
[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
extraPaths = ["src"]
venv = ".venv"
exclude = [".venv", ".git", "__pycache__", "data", "cache", ".ruff_cache"]
useLibraryCodeForTypes = false


# --- pytest config ---
[tool.pytest.ini_options]
filterwarnings = [
  "ignore:time=.*Broker canceled the order due to insufficient margin.*:UserWarning",
]
